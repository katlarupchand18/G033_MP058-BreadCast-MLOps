apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp058-api
  labels:
    app: mp058-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp058-api
  template:
    metadata:
      labels:
        app: mp058-api
    spec:
      containers:
        - name: mp058-api
          image: mp058-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: PYTHONUNBUFFERED
              value: "1"