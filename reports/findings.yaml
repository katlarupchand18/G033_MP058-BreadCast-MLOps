# MP058 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G033"          # your group id, e.g. "G042"
problem_id: "MP058"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "price_rs"           # the column recorded in a different unit
    group_value: "College Gate"  # the value of outlet whose rows are affected
    factor: 100           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 49            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 15            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "bakery_sales"
  best_run_id: "fc991b9b80684faa852ac2769c88779e"        # the MLflow run id of your v1 model
  registered_model_name: "bakery_sales_model"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    price_rs: 0.0240
    temp_c: 0.0899
    footfall_index: 0.0132
    competitor_shops: 0.0083
    shelf_hours: 3.3859
    orders_previous_day: 0.0565
  most_drifted_feature: "shelf_hours"
  mae_by_group:            # v1 on later.csv, per value of outlet
    'Station Road': 79.2230
    'Mall Road': 64.2714
    'College Gate': 217.0036
  worst_served_group: "College Gate"
  mae_v1_on_check: 141.5385    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 48.4270     # v2 on the same rows
  decision: "promote"          # promote or keep